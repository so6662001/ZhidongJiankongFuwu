server:
  port: 8080

spring:
  application:
    name: monitor-integration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/monitor_integration?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
  mail:
    host: ${MAIL_HOST:smtp.exmail.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          ssl:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---- HertzBeat 引擎连接 ----
hertzbeat:
  base-url: ${HERTZBEAT_BASE_URL:http://localhost:1157}
  username: ${HERTZBEAT_USERNAME:admin}
  password: ${HERTZBEAT_PASSWORD:hertzbeat}
  timeout-seconds: 10

# ---- 企业微信自建应用（精准@人）----
wecom:
  corpid: ${WECOM_CORPID:}
  agentid: ${WECOM_AGENTID:}
  secret: ${WECOM_SECRET:}
  default-userids: ${WECOM_DEFAULT_USERIDS:}

# ---- 集成层自身 ----
integration:
  webhook-token: ${WEBHOOK_TOKEN:change-me}
  detail-base-url: ${DETAIL_BASE_URL:http://localhost:1157}
  renotify-interval-seconds: 600

logging:
  level:
    com.company.monitor: INFO
