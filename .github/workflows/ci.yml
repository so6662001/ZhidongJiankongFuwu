name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 单元测试（跳过前端构建）
        working-directory: monitor-integration
        run: mvn -B -Dskip.frontend=true test
      - name: 打包（跳过前端，前端在 frontend 任务单独验证）
        working-directory: monitor-integration
        run: mvn -B -Dskip.frontend=true -DskipTests package

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 构建
        working-directory: frontend
        run: npm run build

  security-scan:
    name: 依赖漏洞扫描 (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy 文件系统扫描（依赖/配置）
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'   # 先不阻断流水线，逐步收敛后可改为 '1'
          format: table
